<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探探里山永續廊道 - 景點圖鑑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config={theme:{extend:{colors:{mori:{base:'#F7F4EF',light:'#E8EFE6',sage:'#8B9D77',forest:'#4A6741',wood:'#D2B48C',dark:'#2C3E28'}},fontFamily:{sans:['Noto Sans TC','sans-serif']}}}}
    </script>
    <style>
        body { background-color: #F7F4EF; color: #2C3E28; font-family: 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal 動畫設定 */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="p-4 md:p-6 custom-scrollbar h-screen overflow-y-auto bg-white rounded-xl shadow-inner border border-gray-100 relative">

    <!-- 頁首標題 -->
    <div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between border-b border-mori-light pb-3 sticky top-0 bg-white/95 backdrop-blur-sm z-10 gap-2 pt-2">
        <h2 class="text-xl md:text-2xl font-black text-mori-forest flex items-center tracking-wide">
            <i class="fas fa-map-marked-alt text-mori-sage mr-2"></i>探探里山永續廊道
        </h2>
        <span class="text-xs font-bold text-gray-400 bg-gray-50 px-2.5 py-1.5 rounded-lg border border-gray-200 shadow-sm inline-flex items-center w-fit">
            <i class="fas fa-link mr-1.5 text-blue-400 animate-pulse"></i>外部連動模組
        </span>
    </div>

    <!-- 景點列表容器 -->
    <div id="poi-list-container" class="space-y-5 pb-10">
        <!-- 景點列表將由 JS 動態生成在此 -->
    </div>

    <!-- 🌟 景點詳細資訊 Modal (外部版本) -->
    <div id="poi-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-[2px] flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl relative max-h-[90vh] flex flex-col transform transition-transform duration-300 scale-95" id="poi-modal-content">
            <!-- Modal Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-gray-500 text-sm"><i class="fas fa-info-circle mr-1"></i>景點詳情</h3>
                <button class="text-gray-400 hover:text-gray-600 transition outline-none bg-gray-50 hover:bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center" onclick="closePoiModal()">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body (可滾動區域) -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-grow">
                <!-- 🌟 傳送至主系統按鈕區塊 -->
                <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 mb-5 text-center shadow-sm">
                    <p class="text-[11px] text-blue-600 font-bold mb-2 tracking-wide flex items-center justify-center">
                        <i class="fas fa-satellite-dish mr-1.5 animate-pulse"></i>將此地點傳送至地圖進行碳里程計算
                    </p>
                    <!-- 觸發送出訊息的按鈕 -->
                    <button onclick="triggerSendToMainApp()" class="w-full py-3.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl hover:shadow-lg hover:from-blue-600 hover:to-indigo-700 font-black text-sm transition-all transform active:scale-95 shadow-md flex items-center justify-center group outline-none tracking-wide">
                        <i class="fas fa-paper-plane mr-2 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>傳送座標至主系統
                    </button>
                </div>
                
                <!-- 景點基本資訊 -->
                <h3 id="poi-modal-title" class="text-xl font-bold text-mori-dark mb-2 leading-tight"></h3>
                <div id="poi-modal-description" class="text-[13px] text-gray-600 leading-relaxed mb-4 bg-gray-50 p-3 rounded-lg border border-gray-100"></div>
                
                <!-- 動態按鈕區 (FB、官網等) -->
                <div id="poi-modal-dynamic-buttons" class="flex flex-col gap-2 mb-4"></div>
                
                <!-- Iframe 預覽區 -->
                <div id="poi-iframe-container" class="hidden w-full flex justify-center overflow-hidden rounded-lg border border-gray-200 shadow-inner relative min-h-[150px]"></div>
            </div>
        </div>
    </div>

    <!-- 提示框 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800/95 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-[60] flex items-center backdrop-blur-sm whitespace-nowrap border border-gray-700">
        <i class="fas fa-check-circle text-green-400 mr-2 text-lg"></i><span id="toast-msg">訊息</span>
    </div>

    <script>
        // === 資料定義 (從您提供的清單中提取) ===
        const poiCategories = [
            { id: 4, title: '1. 水里里山基地', desc: '基地推行里山倡議，串聯商圈與青農之永續據點。' }, 
            { id: 1, title: '2. 里山餐桌團隊', desc: '核心規劃團隊，提供生態旅遊與 ESG 專案規劃。' }, 
            { id: 5, title: '3. 南投青農', desc: '結合優質青農，提供高品質特色食農體驗。' }, 
            { id: 3, title: '4. 水里觀光商圈', desc: '提供在地特色美食與優質採購，支持商圈創生。' }, 
            { id: 2, title: '5. 低碳食宿', desc: '精選本地觀光食宿，倡議節水節電與永續觀光。' }
        ];

        const pois = [
            {categoryId:4,id:'poi1',name:'水里溪畔驛站',coords:{lat:23.809799,lng:120.849286},icon:'🌲',esgEligible:true,fbUrl:'https://www.facebook.com/profile.php?id=100076220760859'},
            {categoryId:4,id:'poi25',name:'台大林管處水里營林區',coords:{lat:23.814313,lng:120.853435},icon:'🏛️',fbUrl:'https://www.facebook.com/xitou.nature.education'},
            {categoryId:1,id:'poi12',name:'湧健酪梨園/梅園 SROI (✓)',coords:{lat:23.725349,lng:120.846123},icon:'🥑',esgEligible:true,fbUrl:'https://www.facebook.com/profile.php?id=100085673588742'},
            {categoryId:1,id:'poi11',name:'阿爾喜莊園 SROI (✓)',coords:{lat:23.803119,lng:120.926340},icon:'🍋',esgEligible:true,fbUrl:'https://www.facebook.com/AHEIemon'},
            {categoryId:1,id:'poi10',name:'雨社山下 SROI (✓)',coords:{lat:23.790644,lng:120.896569},icon:'🥒',esgEligible:true,fbUrl:'https://www.facebook.com/YusheLand'},
            {categoryId:1,id:'poi8',name:'明揚養蜂 SROI (✓)',coords:{lat:23.803787,lng:120.862401},icon:'🐝',esgEligible:true,fbUrl:'https://www.facebook.com/MingYangBee'},
            {categoryId:1,id:'poi7',name:'指令教育農場 SROI (✓)',coords:{lat:23.802776,lng:120.864715},icon:'👆',esgEligible:true,fbUrl:'https://www.facebook.com/FarmCMD'},
            {categoryId:1,id:'poi19',name:'小茶米農場 SROI (✓)',coords:{lat:23.839892,lng:120.632520},icon:'🍵',esgEligible:true},
            {categoryId:1,id:'poi3',name:'鑫鮮菇園',coords:{lat:23.794049,lng:120.859407},icon:'🍄',esgEligible:true},
            {categoryId:1,id:'poi26',name:'饕農園',coords:{lat:23.806217,lng:120.746781},icon:'🧑‍🌾',esgEligible:true},
            {categoryId:1,id:'poi27',name:'Hó-lah! 星澍柢家',coords:{lat:24.102351,lng:120.666805},icon:'🌱',esgEligible:true},
            {categoryId:5,id:'poi30',name:'墨梵農場香草莊園',coords:{lat:23.722627,lng:120.850277},icon:'🪴'},
            {categoryId:5,id:'poi20',name:'集元果觀光工廠',coords:{lat:23.825288,lng:120.814236},icon:'🍌'},
            {categoryId:5,id:'poi21',name:'山水裡愛玉園',coords:{lat:23.827702,lng:120.814354},icon:'🌿'},
            {categoryId:5,id:'poi28',name:'新豐農場(冷泉米)',coords:{lat:24.065240,lng:120.937692},icon:'🌾'},
            {categoryId:5,id:'poi29',name:'逸和園檸檬宿',coords:{lat:24.049875,lng:120.861594},icon:'🍋'},
            {categoryId:3,id:'poi_new1',name:'水里槑休閒農業區',coords:{lat:23.734616,lng:120.856968},icon:'🛖'},
            {categoryId:2,id:'poi16',name:'水里里山村(低碳旅店)',coords:{lat:23.813514,lng:120.853722},icon:'🏡',esgEligible:true},
            {categoryId:2,id:'poi14',name:'機車貓聯盟(食店)',coords:{lat:23.810883,lng:120.855798},icon:'🍚'},
            {categoryId:3,id:'poi23',name:'車程林班道',coords:{lat:23.833913,lng:120.866191},icon:'🚂'},
            {categoryId:3,id:'poi24',name:'車埕木業展示館',coords:{lat:23.833549,lng:120.865796},icon:'🪵'},
            {categoryId:3,id:'poi18',name:'森音 Morinooto',coords:{lat:23.742587,lng:120.866954},icon:'🎶'},
            {categoryId:3,id:'poi9',name:'蛇窯文化園區',coords:{lat:23.801177,lng:120.864479},icon:'🏺'}
        ];

        let currentModalPoi = null; // 記錄目前 Modal 顯示的景點資料

        // === UI 輔助功能 ===
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function closePoiModal() {
            const modal = document.getElementById('poi-modal');
            const content = document.getElementById('poi-modal-content');
            
            // 縮小淡出動畫
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            // 等待動畫結束後隱藏 DOM
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            currentModalPoi = null;
        }

        function openPoiModal() {
            const modal = document.getElementById('poi-modal');
            const content = document.getElementById('poi-modal-content');
            
            // 顯示 DOM，然後執行放大淡入動畫
            modal.classList.remove('hidden');
            // 強制重繪以確保動畫觸發
            void modal.offsetWidth; 
            
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        // === 🌟 核心功能：與主系統連動 API ===
        function sendToMainApp(spotName, lat, lng, description, icon) {
            const payload = {
                action: 'SELECT_EXTERNAL_POI',
                poi: {
                    id: 'ext_spot_' + Date.now(), // 產生暫時唯一碼
                    name: spotName,           
                    coords: { lat: parseFloat(lat), lng: parseFloat(lng) }, 
                    description: description || '從探探里山永續廊道匯入的景點',
                    icon: icon || '📍'                
                }
            };
            
            // 傳送資料回父層視窗 (主系統 iframe) 或來源視窗 (window.open)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, '*');
            } else if (window.opener) {
                window.opener.postMessage(payload, '*');
            } else {
                console.warn('找不到可接收訊息的主系統。', payload);
            }
            
            showToast('📤 景點座標已發送');
            
            // 稍微延遲關閉，讓使用者看到 toast 提示
            setTimeout(() => {
                closePoiModal();
            }, 500);
        }

        // 綁定給 Modal 中按鈕呼叫的包裹函式
        window.triggerSendToMainApp = function() {
            if (currentModalPoi) {
                sendToMainApp(
                    currentModalPoi.name, 
                    currentModalPoi.coords.lat, 
                    currentModalPoi.coords.lng, 
                    currentModalPoi.description, 
                    currentModalPoi.icon
                );
            }
        };

        // === 渲染邏輯 ===
        function renderList() {
            const container = document.getElementById('poi-list-container');
            let html = '';
            
            poiCategories.forEach(cat => {
                const catPois = pois.filter(p => p.categoryId === cat.id);
                if (catPois.length > 0) {
                    html += `
                        <div class="mb-6 last:mb-0">
                            <!-- 分類標題 -->
                            <div class="bg-gray-50 border-l-[5px] border-mori-sage px-4 py-3 rounded-r-xl mb-3 shadow-sm border-t border-r border-b border-gray-100">
                                <h4 class="font-black text-mori-dark text-[15px] tracking-wide">${cat.title}</h4>
                                <p class="text-[11px] text-gray-500 mt-1 leading-relaxed">${cat.desc}</p>
                            </div>
                            
                            <!-- 景點項目網格 -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-1">
                                ${catPois.map(poi => `
                                    <div class="p-3.5 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-blue-400 hover:shadow-md transition-all duration-300 cursor-pointer flex items-center justify-between group transform hover:-translate-y-0.5" onclick="showDetails('${poi.id}')">
                                        <div class="flex items-center overflow-hidden">
                                            <span class="text-2xl mr-3 group-hover:scale-110 transition-transform bg-gray-50 w-11 h-11 flex items-center justify-center rounded-full border border-gray-100 shrink-0 shadow-inner">${poi.icon}</span>
                                            <div class="truncate pr-2">
                                                <h5 class="text-[14px] font-bold text-gray-800 leading-tight truncate">${poi.name.replace('SROI (✓)','<span class="text-green-600 font-black ml-1 bg-green-50 px-1 py-0.5 rounded text-[10px] border border-green-200 shadow-sm whitespace-nowrap">SROI ✓</span>')}</h5>
                                                ${poi.esgEligible ? '<span class="text-[10px] text-mori-sage font-bold inline-block mt-1 bg-mori-light/50 px-1.5 py-0.5 rounded"><i class="fas fa-leaf mr-1"></i>ESG 合作點</span>' : ''}
                                            </div>
                                        </div>
                                        <div class="shrink-0 flex items-center justify-center bg-gray-50 w-8 h-8 rounded-full group-hover:bg-blue-50 transition-colors">
                                            <i class="fas fa-arrow-right text-gray-400 text-xs group-hover:text-blue-500 transition-colors"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
        }

        window.showDetails = function(poiId) {
            const poi = pois.find(p => p.id === poiId);
            if (!poi) return;
            currentModalPoi = poi;
            
            const titleEl = document.getElementById('poi-modal-title');
            if (titleEl) titleEl.innerHTML = `<span class="text-2xl mr-2">${poi.icon}</span>${poi.name.replace('SROI (✓)','')}`;
            
            const descEl = document.getElementById('poi-modal-description');
            if (descEl) descEl.innerHTML = poi.description || '<i class="fas fa-map-pin mr-1 opacity-70"></i>此景點位於南投縣水里鄉，是您探索低碳永續與體驗在地生活的好去處。';
            
            const btnContainer = document.getElementById('poi-modal-dynamic-buttons');
            if (btnContainer) {
                let btnsHtml = '';
                if (poi.fbUrl) btnsHtml += `<a href="${poi.fbUrl}" target="_blank" class="px-4 py-2.5 bg-blue-50 text-blue-600 rounded-lg font-bold text-[13px] text-center border border-blue-200 w-full flex items-center justify-center mb-2 shadow-sm hover:bg-blue-100 transition tracking-wide"><i class="fab fa-facebook mr-2 text-base"></i>查看 Facebook 粉絲頁</a>`;
                if (poi.websiteUrl) btnsHtml += `<a href="${poi.websiteUrl}" target="_blank" class="px-4 py-2.5 bg-gray-50 text-gray-700 rounded-lg font-bold text-[13px] text-center border border-gray-200 w-full flex items-center justify-center mb-2 shadow-sm hover:bg-gray-100 transition tracking-wide"><i class="fas fa-external-link-alt mr-2 text-base"></i>前往官方網站</a>`;
                if (poi.esgEligible && !poi.websiteUrl) { btnsHtml += `<a href="https://farmcmd.github.io/JOY/" target="_blank" class="px-4 py-2.5 bg-yellow-50 text-yellow-700 rounded-lg font-bold text-[13px] text-center border border-yellow-200 w-full flex items-center justify-center shadow-sm hover:bg-yellow-100 transition tracking-wide"><i class="fas fa-ticket-alt mr-2 text-base"></i>查看活動與預約</a>`; }
                btnContainer.innerHTML = btnsHtml;
            }
            
            const iframeContainer = document.getElementById('poi-iframe-container');
            if (iframeContainer) {
                if (poi.iframeUrl) {
                    if (poi.iframeUrl.includes('facebook.com') || poi.iframeUrl.includes('fb.com')) {
                        iframeContainer.innerHTML = `<div class="w-full bg-white flex justify-center py-2"><div class="fb-page" data-href="${poi.iframeUrl}" data-tabs="timeline" data-width="380" data-height="350" data-small-header="false" data-adapt-container-width="true" data-hide-cover="false" data-show-facepile="false"><blockquote cite="${poi.iframeUrl}" class="fb-xfbml-parse-ignore"><a href="${poi.iframeUrl}" target="_blank" class="text-blue-500 text-sm font-bold"><i class="fab fa-facebook mr-1"></i>載入中...</a></blockquote></div></div>`;
                        iframeContainer.classList.remove('hidden');
                        setTimeout(() => { if (window.FB) window.FB.XFBML.parse(iframeContainer); }, 150);
                    } else {
                        iframeContainer.innerHTML = `<iframe src="${poi.iframeUrl}" class="w-full h-[250px] border-none bg-gray-50" allowfullscreen></iframe>`;
                        iframeContainer.classList.remove('hidden');
                    }
                } else {
                    iframeContainer.innerHTML = '';
                    iframeContainer.classList.add('hidden');
                }
            }
            
            openPoiModal();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', renderList);

    </script>
</body>
</html>
